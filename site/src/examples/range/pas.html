<div class="ch-field">
  <div class="ch-row ch-row--between">
    <label class="ch-field__label" for="ex-range-zoom">Zoom de la carte</label>
    <output class="ch-range__value" for="ex-range-zoom"></output>
  </div>
  <input class="ch-range" id="ex-range-zoom" type="range" min="1" max="5" step="1" value="3" data-ch-range="{v} sur 5">
  <span class="ch-field__help">Pas de 1 : flèches pour avancer d'un cran, Début et Fin pour les extrémités. Le modèle « {v} sur 5 » donne aussi le texte lu par le lecteur d'écran.</span>
</div>
