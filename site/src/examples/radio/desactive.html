<form action="#">
  <fieldset class="ch-fieldset">
    <legend class="ch-fieldset__legend">Mode de livraison</legend>
    <label class="ch-choice"><input class="ch-radio" type="radio" name="ex-radio-livraison" value="retrait" checked> Retrait à l'atelier</label>
    <label class="ch-choice"><input class="ch-radio" type="radio" name="ex-radio-livraison" value="colis" disabled> Colis suivi (indisponible)</label>
  </fieldset>
  <fieldset class="ch-fieldset" disabled>
    <legend class="ch-fieldset__legend">Mode de paiement (verrouillé)</legend>
    <label class="ch-choice"><input class="ch-radio" type="radio" name="ex-radio-paiement" value="carte" checked> Carte</label>
    <label class="ch-choice"><input class="ch-radio" type="radio" name="ex-radio-paiement" value="virement"> Virement</label>
  </fieldset>
</form>
