<button class="ch-btn ch-btn--secondary" type="button" data-ch-dialog-open="#ex-effacer" data-ch-needs-js>Effacer la sauvegarde</button>
<dialog class="ch-modal ch-modal--sm" id="ex-effacer" role="alertdialog" aria-labelledby="ex-effacer-titre" aria-describedby="ex-effacer-texte">
  <div class="ch-modal__head">
    <h2 class="ch-modal__title" id="ex-effacer-titre">Effacer la sauvegarde ?</h2>
    <button class="ch-btn ch-btn--icon ch-btn--ghost ch-modal__close" type="button" data-ch-dialog-close aria-label="Fermer sans effacer"><svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-close"></use></svg></button>
  </div>
  <div class="ch-modal__body">
    <p class="ch-t-body" id="ex-effacer-texte">Les trois emplacements de la partie « Brume » seront perdus. Cette action est définitive.</p>
  </div>
  <div class="ch-modal__foot">
    <button class="ch-btn ch-btn--secondary" type="button" data-ch-dialog-close>Garder</button>
    <button class="ch-btn ch-btn--primary" type="button" data-ch-dialog-close>Effacer</button>
  </div>
</dialog>
