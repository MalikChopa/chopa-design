<button class="ch-btn ch-btn--primary" type="button" data-ch-dialog-open="#ex-pause" data-ch-needs-js>Mettre en pause</button>
<dialog class="ch-modal" id="ex-pause" aria-labelledby="ex-pause-titre">
  <div class="ch-modal__head">
    <h2 class="ch-modal__title" id="ex-pause-titre">Partie en pause</h2>
    <button class="ch-btn ch-btn--icon ch-btn--ghost ch-modal__close" type="button" data-ch-dialog-close aria-label="Fermer la fenêtre de pause"><svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-close"></use></svg></button>
  </div>
  <div class="ch-modal__body">
    <div class="ch-stack ch-stack--s3">
      <p class="ch-t-body">Niveau 7, « Les marais de verre ». La progression est sauvegardée à chaque point de contrôle.</p>
      <p class="ch-t-small">Temps de jeu : 2 h 14. Dernier point de contrôle il y a 3 minutes.</p>
    </div>
  </div>
  <div class="ch-modal__foot">
    <button class="ch-btn ch-btn--secondary" type="button" data-ch-dialog-close>Quitter la partie</button>
    <button class="ch-btn ch-btn--primary" type="button" data-ch-dialog-close autofocus>Reprendre</button>
  </div>
</dialog>
