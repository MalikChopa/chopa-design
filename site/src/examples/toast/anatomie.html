<div class="ch-stack ch-stack--s3">
  <div class="ch-toast ch-toast--info">
    <svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-info"></use></svg>
    <div class="ch-toast__body"><b class="ch-toast__kind">Info</b><span class="ch-toast__text">Carnet de recettes enregistré.</span></div>
    <button class="ch-btn ch-btn--icon ch-btn--ghost ch-toast__close" type="button" aria-label="Fermer la notification"><svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-close"></use></svg></button>
  </div>
  <div class="ch-toast ch-toast--warn">
    <svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-alert"></use></svg>
    <div class="ch-toast__body"><b class="ch-toast__kind">Attention</b><span class="ch-toast__text">Le brouillon n'a pas été relu depuis trois jours.</span></div>
    <button class="ch-btn ch-btn--secondary ch-toast__action" type="button">Relire</button>
    <button class="ch-btn ch-btn--icon ch-btn--ghost ch-toast__close" type="button" aria-label="Fermer la notification"><svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-close"></use></svg></button>
  </div>
  <div class="ch-toast ch-toast--error">
    <svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-alert"></use></svg>
    <div class="ch-toast__body"><b class="ch-toast__kind">Erreur</b><span class="ch-toast__text">La sauvegarde a échoué : le disque est plein.</span></div>
    <button class="ch-btn ch-btn--icon ch-btn--ghost ch-toast__close" type="button" aria-label="Fermer la notification"><svg class="ch-icon" aria-hidden="true" focusable="false"><use href="/chopa/chopa-icons.svg#ch-i-close"></use></svg></button>
  </div>
</div>
